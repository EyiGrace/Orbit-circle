<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerMap Login</title>
<link rel="stylesheet" href="Login.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div >


<div class="login-box">

<h1>Let's continue</h1>
<h2>Your Journey.</h2>

<p class="subtitle">
Sign in to discover careers that match your strengths and interests.
</p>

<form id="loginForm">

<label>Email Address</label>

<div class="input-box">
<i class="fa-regular fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email address"
required>

</div>

<div class="password-head">

<label>Password</label>

<a href="forgot-password.html">
Forgot password?
</a>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<i
class="fa-regular fa-eye eye"
id="togglePassword">
</i>

</div>

<div class="remember">

<input
type="checkbox"
id="remember">

<label for="remember">
Remember me
</label>

</div>

<button class="login-btn" type="submit">

Log In

<i class="fa-solid fa-arrow-right"></i>

</button>

<div class="divider">

<span>or continue with</span>

</div>

<button type="button" class="google-btn">

<img
src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

Google

</button>

 <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID"
            data-context="signup"
            data-callback="handleCredentialResponse">
        </div>


<p class="signup">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</form>

</div>

</div>

<script>
    const form = document.getElementById("loginForm");

const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.onclick = () => {

if(password.type==="password"){

password.type="text";

togglePassword.classList.replace(
"fa-eye",
"fa-eye-slash"
);

}else{

password.type="password";

togglePassword.classList.replace(
"fa-eye-slash",
"fa-eye"
);

}

};

// LOGIN

form.addEventListener("submit",(e)=>{

e.preventDefault();

const email=document.getElementById("email").value.trim();

const pass=password.value;

const savedUser=JSON.parse(localStorage.getItem("user"));

if(!savedUser){

alert("No account found. Please create an account first.");

window.location.href="home.html";

return;

}

if(
email===savedUser.email &&
pass===savedUser.password
){

// Remember me

if(document.getElementById("remember").checked){

localStorage.setItem("rememberUser","true");

}

// Redirect

window.location.href="home.html";

}else{

alert("Incorrect email or password.");

}

});

// Google button

document.querySelector(".google-btn").onclick=()=>{

window.location.href="https://accounts.google.com/";

};
</script>

</body>
</html>
