<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Mentor</title>

    <!-- CSS -->
    <link rel="stylesheet" href="mentor.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- Header -->
    <header>
        <button class="back-btn">
            <i class="fas fa-chevron-left"></i>
        </button>

        <h2>Find a Mentor</h2>
    </header>

    <!-- Mentor Illustration -->
    <div class="hero">

        <!-- Replace with your own image -->
        <img src="image/message.png" alt="Mentor">

    </div>

    <!-- Text -->
    <div class="content">

        <h1>We'll find the right mentors for you.</h1>

        <p>
            Answer a few questions and we'll
            show you mentors personalized for
            your career goals.
        </p>

    </div>

    <!-- Button -->
    <button class="start-btn">
        Get Started
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="home.html">
            <i class="fa-regular fa-house"></i>
            <span>Home</span>
        </a>

        <a href="profile.html">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="#" class="active">
            <i class="fa-solid fa-user-group"></i>
            <span>Mentors</span>
        </a>

        <a href="saved.html">
            <i class="fa-regular fa-bookmark"></i>
            <span>Saved</span>
        </a>

    </nav>

</div>

<script>
  // Back button
document.querySelector(".back-btn").addEventListener("click", () => {
    history.back();
});

// Get Started Button
document.querySelector(".start-btn").addEventListener("click", () => {

    // Go to mentor questions page
    window.location.href = "mentor-profile.html";

});

// Bottom Navigation
document.querySelectorAll(".bottom-nav a").forEach(link => {

    link.addEventListener("click", function () {

        document.querySelectorAll(".bottom-nav a")
            .forEach(item => item.classList.remove("active"));

        this.classList.add("active");

    });

});  
</script>

</body>
</html>
