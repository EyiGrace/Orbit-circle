<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div>

        <div class="signup-box">

            <h1>
                Create your
                <span>account</span>
            </h1>

            <p class="subtitle">
                Let's get you started on your journey to discover the right career path
            </p>

            <form id="signupForm">

                <!-- Full Name -->
                <label>Full Name</label>

                <div class="input-box">
                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- Email -->
                <label>Email Address</label>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <!-- Password -->
                <label>Password</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <i
                        class="fa-regular fa-eye eye"
                        id="togglePassword">
                    </i>
                </div>

                <p class="password-note">
                    At least 8 characters with letters, numbers & symbols
                </p>

                <!-- Confirm Password -->
                <label>Confirm Password</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <i
                        class="fa-regular fa-eye eye"
                        id="toggleConfirm">
                    </i>
                </div>

                <!-- Create Account Button -->
                <button class="create-btn" type="submit">
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <p class="or">or sign up with</p>

            <button class="google-btn">
                <img
            src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
                Google
            </button>

            <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID"
            data-context="signup"
            data-callback="handleCredentialResponse">
        </div>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script>
        const signupForm = document.getElementById("signupForm");

// Show/Hide Password
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const togglePassword = document.getElementById("togglePassword");
const toggleConfirm = document.getElementById("toggleConfirm");

togglePassword.addEventListener("click", () => {
    if (password.type === "password") {
        password.type = "text";
        togglePassword.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        togglePassword.classList.replace("fa-eye-slash", "fa-eye");
    }
});

toggleConfirm.addEventListener("click", () => {
    if (confirmPassword.type === "password") {
        confirmPassword.type = "text";
        toggleConfirm.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        confirmPassword.type = "password";
        toggleConfirm.classList.replace("fa-eye-slash", "fa-eye");
    }
});

// Create Account
signupForm.addEventListener("submit", function (e) {

    e.preventDefault();

    const fullName = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = password.value.trim();
    const confirm = confirmPassword.value.trim();

    if (fullName === "" || email === "" || pass === "" || confirm === "") {
        alert("Please fill in all fields.");
        return;
    }

    if (pass.length < 8) {
        alert("Password must be at least 8 characters.");
        return;
    }

    if (pass !== confirm) {
        alert("Passwords do not match.");
        return;
    }

    // Save user details
    const user = {
        fullName,
        email,
        password: pass
    };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Account created successfully!");

    // Redirect to Home Page
    window.location.href = "home.html";
});

// Google Button
const googleBtn = document.querySelector(".google-btn");

googleBtn.addEventListener("click", () => {

    google.accounts.id.prompt();

});
        function handleCredentialResponse(response){

fetch("http://localhost:5000/api/auth/google",{
    method:"POST",
    headers:{
        "Content-Type":"application/json"
    },
    body:JSON.stringify({
        credential:response.credential
    })
})
.then(res=>res.json())
.then(data=>{

localStorage.setItem("token",data.token);

window.location.href="dashboard.html";

});
}


    </script>

</body>
</html>
