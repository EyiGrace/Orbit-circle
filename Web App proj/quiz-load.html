<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Quiz</title>

    <link rel="stylesheet" href="quiz-load.css">
</head>
<body>

    <main>

        <!-- Header -->
        <header class="quiz-header">
            <button class="back-btn" id="backBtn">
                ‹
            </button>

            <h1>Career Quiz</h1>
        </header>

        <img class="background" src="image/Background image (12).png" alt="update">

        <!-- Text -->
        <section class="analysis">
            <h2>Analyzing your answers...</h2>

            <p>This will take only a few seconds</p>
        </section>

        <!-- Progress -->
        <div class="progress-section">

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <span id="progressText">50%</span>

        </div>

    </main>

    <script>

const backBtn = document.getElementById("backBtn");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

backBtn.addEventListener("click", () => {
    window.history.back();
});

let progress = 50;

const progressTimer = setInterval(() => {

    if (progress < 100) {
        progress++;

        progressFill.style.width = `${progress}%`;
        progressText.textContent = `${progress}%`;
    }

    if (progress === 100) {
        clearInterval(progressTimer);

        setTimeout(() => {
            window.location.href = "results.html";
        }, 800);
    }

}, 100);
        
    </script>
</body>
</html>
