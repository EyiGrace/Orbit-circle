<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Quiz</title>

<link rel="stylesheet" href="quiz.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="quiz-container">

    <!-- Header -->
    <header>

        <button class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h2>Career Quiz</h2>

        <div class="count">
            <span id="current">1</span>/<span id="total">15</span>
        </div>

    </header>

    <!-- Progress -->

    <div class="progress">

        <div class="progress-fill"></div>

    </div>

    <!-- Question -->

    <div class="question-area">

        <h1>

            Which activities do you

            <span>enjoy</span>

            the most?

        </h1>

        <p>
            Pick the one that describes you best.
        </p>

    </div>

    <!-- Answers -->

    <div class="answers">

        <div class="answer">

            <span>Writing stories, articles or content</span>

            <div class="radio"></div>

        </div>

        <div class="answer">

            <span>Building or fixing things, working with tools</span>

            <div class="radio"></div>

        </div>

        <div class="answer">

            <span>Analyzing data and solving problems</span>

            <div class="radio"></div>

        </div>

        <div class="answer">

            <span>Designing, creating or drawing</span>

            <div class="radio"></div>

        </div>

        <div class="answer">

            <span>Helping, teaching or counseling people</span>

            <div class="radio"></div>

        </div>

    </div>

    <!-- Buttons -->

    <button id="nextBtn">

        Next

        <i class="fa-solid fa-arrow-right"></i>

    </button>

    <button class="skip-btn">

        Skip Question

    </button>

</div>

<script>
    const answers = document.querySelectorAll(".answer");
const progress = document.querySelector(".progress-fill");

const current = document.getElementById("current");
const total = document.getElementById("total");

let question = 1;

const totalQuestions = 15;

total.innerText = totalQuestions;

answers.forEach(answer => {

    answer.addEventListener("click", () => {

        answers.forEach(a => a.classList.remove("active"));

        answer.classList.add("active");

    });

});

document.getElementById("nextBtn").addEventListener("click", () => {

    const selected = document.querySelector(".answer.active");

    if(!selected){

        alert("Please choose an answer.");

        return;

    }

    if(question < totalQuestions){

        question++;

        current.innerText = question;

        progress.style.width =
        (question / totalQuestions) * 100 + "%";

        answers.forEach(a=>a.classList.remove("active"));

    }else{

        window.location.href="quiz-load.html";

    }

});

document.querySelector(".skip-btn").addEventListener("click",()=>{

    if(question < totalQuestions){

        question++;

        current.innerText = question;

        progress.style.width =
        (question / totalQuestions) * 100 + "%";

        answers.forEach(a=>a.classList.remove("active"));

    }

});

    fetch("http://localhost:5000/api/quiz")
.then(res=>res.json())
.then(data=>{

console.log(data);

});

     fetch("http://localhost:5000/api/quiz/submit",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

answers

})   

});
</script>

</body>
</html>
